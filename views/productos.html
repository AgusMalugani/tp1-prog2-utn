<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda 3D - Productos</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <header>
    <h1>Productos 3D</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="./productos.html">Productos</a></li>
        <li><a href="./carrito.html">Carrito</a></li>
        <li><a href="./contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Catálogo</h2>

    <div id="lista-productos" class="grid-productos">

      <!-- Producto 1 -->
      <div class="producto-card">
        <img src="../assets/images/porta_llave.jfif" alt="Llaveros 3D">
        <h3>Llaveros Hexagonales 3D</h3>
        <p>$2500</p>
        <button onclick="agregarAlCarrito(1)">Agregar al carrito</button>
      </div>

      <!-- Producto 2 -->
      <div class="producto-card">
        <img src="../assets/images/maceta_groot.jpeg" alt="Macetas 3D">
        <h3>Macetas Figuritas 3D</h3>
        <p>$6000</p>
        <button onclick="agregarAlCarrito(2)">Agregar al carrito</button>
      </div>

      <!-- Producto 3 -->
      <div class="producto-card">
        <img src="../assets/images/perro.jfif" alt="Perritos 3D">
        <h3>Perritos Balloon 3D</h3>
        <p>$8500</p>
        <button onclick="agregarAlCarrito(3)">Agregar al carrito</button>
      </div>

      <!-- Producto 4 -->
      <div class="producto-card">
        <img src="../assets/images/porta_capsula.jfif" alt="Organizador Café">
        <h3>Organizador Cápsulas Café</h3>
        <p>$7000</p>
        <button onclick="agregarAlCarrito(4)">Agregar al carrito</button>
      </div>

      <!-- Producto 5 -->
      <div class="producto-card">
        <img src="../assets/images/maceta_pareja.jfif" alt="Maceta pareja 3D">
        <h3>Organizador Mario Bros</h3>
        <p>$9000</p>
        <button onclick="agregarAlCarrito(5)">Agregar al carrito</button>
      </div>

    </div>
  </main>

  <footer>
    <p>© 2026 Tienda 3D</p>
  </footer>

  <script src="../app.js"></script>
</body>
</html>
